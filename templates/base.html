<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}豆瓣电影数据分析可视化系统{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f2f5; color: #333;
        }
        .navbar {
            background: #1f2d3d; color: #fff;
            padding: 14px 32px; display: flex; align-items: center; gap: 28px;
        }
        .navbar .brand { font-size: 18px; font-weight: bold; }
        .navbar a {
            color: #cfd8e3; text-decoration: none; font-size: 15px;
            padding: 4px 10px; border-radius: 4px;
        }
        .navbar a:hover, .navbar a.active { color: #fff; background: #39506b; }
        .container { max-width: 1280px; margin: 24px auto; padding: 0 20px; }
        .card {
            background: #fff; border-radius: 8px; padding: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px;
        }
        .card h3 {
            font-size: 15px; color: #1f2d3d; margin-bottom: 12px;
            border-left: 4px solid #4a7cf7; padding-left: 10px;
        }
        .chart { width: 100%; height: 320px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <span class="brand">🎬 豆瓣电影数据分析可视化系统</span>
        <a href="/" class="{% block nav_index %}{% endblock %}">数据大屏</a>
        <a href="/movie" class="{% block nav_movie %}{% endblock %}">影片查询</a>
        <a href="/predict" class="{% block nav_predict %}{% endblock %}">评分预测</a>
        <a href="/recommend" class="{% block nav_recommend %}{% endblock %}">相似推荐</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
