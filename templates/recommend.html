{% extends "base.html" %}
{% block title %}相似推荐 · 豆瓣电影数据分析可视化系统{% endblock %}
{% block nav_recommend %}active{% endblock %}

{% block content %}
<div class="card" style="max-width: 900px;">
    <h3>相似电影推荐</h3>
    <p style="color:#666; font-size:13px; margin-bottom:18px; line-height:1.8;">
        基于电影类型标签的余弦相似度计算：选一部你喜欢的电影，
        系统从 Top250 中找出类型最相近的作品并给出推荐。
    </p>
    <div style="display:flex; gap:12px; align-items:center;">
        <select id="movie-select"
                style="flex:1; padding:9px 12px; border:1px solid #dcdfe6; border-radius:4px;">
            <option value="">加载电影列表中 ...</option>
        </select>
        <button onclick="doRecommend()"
                style="padding:9px 30px; background:#4a7cf7; color:#fff; border:none; border-radius:4px; cursor:pointer;">
            获取推荐
        </button>
    </div>

    <div id="recommend-list" style="margin-top:20px;"></div>
</div>
{% endblock %}

{% block extra_head %}
<script>
// 下拉框加载全部电影
async function loadMovieOptions() {
    const resp = await fetch('/api/recommend/movies');
    const movies = await resp.json();
    const select = document.getElementById('movie-select');
    select.innerHTML = movies.map(m =>
        `<option value="${m.movie_id}">${m.title_cn}（${m.genre}）</option>`
    ).join('');
}

async function doRecommend() {
    const movieId = document.getElementById('movie-select').value;
    if (!movieId) return;
    const resp = await fetch('/api/recommend?movie_id=' + movieId);
    const data = await resp.json();
    const box = document.getElementById('recommend-list');

    if (data.error) {
        box.innerHTML = `<p style="color:#f56c6c;">${data.error}</p>`;
        return;
    }
    box.innerHTML = data.recommendations.map((m, i) => `
        <div style="display:flex; justify-content:space-between; align-items:center;
                    padding:12px 16px; margin-bottom:8px; background:#f5f7fa; border-radius:6px;">
            <div>
                <span style="display:inline-block; width:26px; height:26px; line-height:26px;
                             text-align:center; background:#4a7cf7; color:#fff;
                             border-radius:50%; font-size:13px; margin-right:10px;">${i + 1}</span>
                <b>${m.title_cn}</b>
                <span style="color:#999; font-size:12px; margin-left:8px;">
                    ${m.year} · ${m.country} · ${m.genre}
                </span>
            </div>
            <div style="text-align:right;">
                <div style="color:#e6a23c; font-weight:bold;">${m.rating} 分</div>
                <div style="color:#999; font-size:12px;">相似度 ${(m.similarity * 100).toFixed(0)}%</div>
            </div>
        </div>
    `).join('');
}

loadMovieOptions();
</script>
{% endblock %}
